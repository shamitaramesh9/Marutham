<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marutham | Interactive Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --marutham-green: #2d5a27; --bg: #f4f7f4; --danger: #ff4d4d; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; }
        
        .sidebar { width: 240px; background: var(--marutham-green); color: white; height: 100vh; padding: 20px; position: fixed; }
        .content { margin-left: 280px; padding: 40px; width: 100%; }
        .grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }

        /* LIVE CAMERA STYLING */
        .camera-container {
            position: relative;
            width: 100%;
            height: 350px;
            background: #000 url('https://images.unsplash.com/photo-1625246333195-78d9c38ad449?auto=format&fit=crop&q=80&w=1000') center;
            background-size: cover;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #333;
        }
        .camera-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 255, 0, 0.05); /* Slight green tint for night vision feel */
            pointer-events: none;
        }
        .rec-dot {
            position: absolute;
            top: 20px; left: 20px;
            color: var(--danger);
            font-weight: bold;
            display: flex; align-items: center; gap: 5px;
            animation: blink 1s infinite;
        }
        .timestamp {
            position: absolute;
            bottom: 20px; right: 20px;
            color: white; font-family: 'Courier New', monospace;
            background: rgba(0,0,0,0.5); padding: 5px 10px;
        }
        .scan-line {
            width: 100%; height: 2px; background: rgba(0, 255, 0, 0.2);
            position: absolute; top: 0;
            animation: scan 4s linear infinite;
        }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }
        @keyframes scan { from { top: 0; } to { top: 100%; } }

        .btn-action { background: var(--marutham-green); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>மருதம்</h2>
    <p>Logged in: <strong>Landowner</strong></p>
    <hr>
    <p>📍 Plot: Usilampatti</p>
    <p>📊 Status: Healthy</p>
    <button class="btn-action" onclick="window.location.href='index.html'" style="background:#8b0000; margin-top:20px;">Logout</button>
</div>

<div class="content">
    <h1>Marutham Control Center</h1>
    
    <div class="grid">
        <div class="card">
            <h3>24/7 Surveillance Feed (OpenCV Node)</h3>
            <div class="camera-container">
                <div class="camera-overlay"></div>
                <div class="scan-line"></div>
                <div class="rec-dot">● REC</div>
                <div class="timestamp" id="clock">00:00:00</div>
            </div>
            <p style="font-size: 0.9rem; color: #666; margin-top: 10px;">
                <em>AI Motion Detection: Enabled | Night Vision: Auto</em>
            </p>
        </div>

        <div class="card">
            <h3>Soil Moisture Analytics</h3>
            <canvas id="moistureChart"></canvas>
            <div style="margin-top: 20px; text-align: center;">
                <button class="btn-action" onclick="updateData()">Simulate Sensor Pulse</
